<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Auditoría en R³ · Álgebra y Geometría Analítica</title>
    <link rel="stylesheet" href="./css/main.css" />
    <link rel="stylesheet" href="./css/procedimiento.css" />
    <link rel="stylesheet" href="./css/cartesian-3d.css" />
  </head>
  <body>
    <main class="app-shell" aria-label="Presentación interactiva de Álgebra y Geometría Analítica">
      <!-- Título de la diapositiva en la esquina superior izquierda -->
      <h1 id="slide-title" class="slide-corner-title">Informe técnico &amp; auditoría epistemológica</h1>

      <!-- Main Presentation Workspace -->
      <section class="workspace">
        <!-- Stage Area (Left Side) -->
        <section class="stage-panel" aria-label="Diapositiva actual">
          <!-- Procedimiento Visual Cards Layer -->
          <div id="procedimiento-layer" class="procedimiento-layer" aria-live="polite" aria-label="Apoyo visual interactivo de la escena actual">
            <div id="procedimiento-grid" class="procedimiento-grid" role="region" aria-label="Objetos visuales de la escena"></div>
          </div>

          <!-- Cartesian 3D Viewer Container (Opens below presentation) -->
          <div id="cartesian-3d-container"></div>
        </section>

        <!-- Presenter 3D Scene (Right Side Avatar) -->
        <aside class="presenter-panel" aria-label="Presentador 3D">
          <div id="avatar-stage" class="avatar-stage">
            <canvas id="avatar-canvas" role="application" tabindex="0" aria-label="Presentador 3D interactivo"></canvas>
            <div id="avatar-fallback" class="avatar-fallback" hidden aria-hidden="true">R³</div>
          </div>
        </aside>
      </section>

      <!-- Bottom Control Bar (Rectangular, Centered at bottom) -->
      <nav class="stage-controls" role="group" aria-label="Controles de presentación">
        <button id="prev-btn" class="presentation-button nav-button" type="button" aria-label="Diapositiva anterior" title="Atrás">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
          <span>Atrás</span>
        </button>
        <button id="next-btn" class="presentation-button nav-button" type="button" aria-label="Diapositiva siguiente" title="Siguiente">
          <span>Siguiente</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
        </button>
        <button id="speak-btn" class="presentation-button start-button" type="button" aria-label="Iniciar párrafo" title="Iniciar párrafo">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5 11 7-11 7z"/></svg>
          <span>Iniciar</span>
        </button>
        <button id="stop-btn" class="presentation-button stop-button" type="button" aria-label="Detener párrafo" title="Detener párrafo">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="7" width="10" height="10"/></svg>
          <span>Detener</span>
        </button>
        <button id="pause-btn" class="presentation-button pause-button" type="button" aria-label="Pausar párrafo" title="Pausar párrafo" aria-pressed="false" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14"/></svg>
          <span>Pausar</span>
        </button>
        <!-- 3D Graph Button with Custom Paper & Pencil Icon -->
        <button id="btn-toggle-3d" class="presentation-button graph-button" type="button" aria-label="Girar Gráfico 3D" title="Girar Gráfico 3D en R³">
          <svg viewBox="0 0 24 24" class="icon-paper-pencil" aria-hidden="true">
            <!-- Sheet of paper -->
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" fill="none" stroke="currentColor" stroke-width="1.8"></path>
            <polyline points="14 2 14 8 20 8" fill="none" stroke="currentColor" stroke-width="1.8"></polyline>
            <!-- Lines on paper -->
            <line x1="7" y1="12" x2="11" y2="12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></line>
            <line x1="7" y1="16" x2="10" y2="16" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></line>
            <!-- Pencil with eraser -->
            <path d="M18.85 9.15l2 2a1.2 1.2 0 0 1 0 1.7l-7.35 7.35-3.5.8 0.8-3.5 7.35-7.35a1.2 1.2 0 0 1 1.7 0z" fill="var(--orange)" stroke="var(--orange)" stroke-width="1.2"></path>
          </svg>
          <span>Gráfico 3D</span>
        </button>
      </nav>

      <span id="live-status" class="visually-hidden" aria-live="polite">Modelo 3D: cargando · Voz: lista</span>
    </main>

    <!-- Dependencies via local ES Modules Map -->
    <script type="importmap">
      {
        "imports": {
          "three": "./node_modules/three/build/three.module.js",
          "three/addons/": "./node_modules/three/examples/jsm/",
          "gsap": "./node_modules/gsap/index.js"
        }
      }
    </script>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
